[project]
name = "deep-space-ops"
version = "1.0.0"
description = "Deep Space Ops: AI Engineering with Python — 3-day course materials"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "openai>=3.31",
    "mcp>=2.3",
    "pydantic>=2.14",
    "sse-starlette>=3.5",
    "tiktoken>=0.14",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-httpx>=0.36",
    "ruff>=0.17",
]
rag = [
    "chromadb>=1.5",
    "sentence-transformers>=6.1",
    "networkx>=3.7",
]
langchain = [
    "langchain-core>=1.6",
    "langchain-openai>=1.7",
    "langchain>=1.4",
    "langchain-chroma>=1.1",
    "langgraph>=1.2",
]
audio = [
    "sounddevice>=0.5",
    "numpy>=2.5",
]
local-ml = [
    "torch>=2.14",
    "transformers>=5.19",
    "datasets>=5.1",
    "accelerate>=1.15",
    "sentencepiece>=0.2",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: calls the live OpenAI API (needs OPENAI_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
