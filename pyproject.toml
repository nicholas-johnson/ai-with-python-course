[project]
name = "deep-space-ops"
version = "1.0.0"
description = "Deep Space Ops: AI Engineering with Python — 3-day course materials"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.50",
    "mcp>=1.0",
    "pydantic>=2.9",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
langchain = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
